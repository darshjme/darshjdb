## DarshJDB — SINGLE-NODE DEV / SMALL-DEPLOYMENT STACK
##
## ╔══════════════════════════════════════════════════════════════════╗
## ║                      NOT FOR PRODUCTION                          ║
## ║                                                                  ║
## ║  This compose file runs a SINGLE Postgres node with no replica,  ║
## ║  no Patroni, no pgBouncer, and no WAL-G archival. It is suitable ║
## ║  for development, single-tenant pilots, and hobby deployments.   ║
## ║                                                                  ║
## ║  For production HA (3-node Patroni + etcd + HAProxy + pgBouncer  ║
## ║  + WAL-G + multi-replica DarshJDB) use:                          ║
## ║      docker compose -f docker-compose.ha.yml up -d               ║
## ║                                                                  ║
## ║  See docs/HORIZONTAL_SCALING.md for the full topology.           ║
## ╚══════════════════════════════════════════════════════════════════╝
##
## Usage: docker compose up -d
## Secrets: provide via .env file (never commit it)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── DarshJDB Server ──────────────────────────────────────────────────
  darshjdb:
    image: darshjme/darshjdb:${DDB_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DDB_HOST_PORT:-7700}:7700"
    environment:
      DATABASE_URL: "postgres://darshan:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/darshjdb"
      DDB_PORT: "7700"
      DDB_ADMIN_DIR: /usr/share/darshan/admin
      DDB_STORAGE_KEY: ${DDB_STORAGE_KEY:?Set DDB_STORAGE_KEY in .env}
      DDB_JWT_SECRET: ${DDB_JWT_SECRET:?Set DDB_JWT_SECRET in .env}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M
    volumes:
      - ddb_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging: *default-logging
    networks:
      - darshjdb
    security_opt:
      - no-new-privileges:true

  # ── DarshJDB cache server (RESP3, Redis-compatible) ──────────────────
  # Slice 11 — a standalone binary (packages/cache-server), NOT part of
  # ddb-server. Same image, different command.
  ddb-cache:
    image: darshjme/darshjdb:${DDB_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["ddb-cache-server"]
    ports:
      - "${DDB_CACHE_HOST_PORT:-7701}:7701"
    environment:
      DARSH_CACHE_PORT: "7701"
      # AUTH is optional in the binary; require it here so a published
      # port is never left unauthenticated.
      DARSH_CACHE_PASSWORD: ${DARSH_CACHE_PASSWORD:?Set DARSH_CACHE_PASSWORD in .env}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7701'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M
    logging: *default-logging
    networks:
      - darshjdb
    security_opt:
      - no-new-privileges:true

  # ── PostgreSQL 16 with TimescaleDB + pgvector ────────────────────────
  # Base image: timescale/timescaledb-ha:pg16-latest (ships with timescaledb,
  # pgvector, postgis and pg_cron preloaded — covers the full DarshJDB stack).
  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    environment:
      POSTGRES_USER: darshan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: darshjdb
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # No /docker-entrypoint-initdb.d mount: ddb-server applies the full
    # packages/server/migrations set at boot. Seeding only 001_initial.sql
    # here left the schema several migrations behind.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darshan -d darshjdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
    logging: *default-logging
    networks:
      - darshjdb
    # Not exposed to host in production — access via darshjdb service only

  # Redis and Qdrant were removed: no crate in the workspace links a Redis
  # or Qdrant client, and DDB_REDIS_URL / DDB_QDRANT_URL were read by
  # nothing. Caching is ddb-cache (RESP3), vectors are pgvector in Postgres.

volumes:
  pgdata:
    driver: local
  ddb_data:
    driver: local

networks:
  darshjdb:
    driver: bridge
