## DarshJDB — Development Overrides
## Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
##
## What changes from production:
##   - Debug logging
##   - Postgres port exposed for direct DB access
##   - pgAdmin, Prometheus, Grafana included
##   - JWT secret and cache password auto-set (no .env required)

services:
  # ── DarshJDB (dev mode) ─────────────────────────────────────────────
  # NOTE: hot-reload of Rust code inside the container is NOT supported.
  # The compiled binary is baked at build time; `DDB_WATCH=true` (previously
  # set here) was misleading and has been removed. The `target: builder`
  # override was worse — that stage has no entrypoint for ddb-server, so the
  # container exited immediately and restart-looped. Dev builds the same
  # runtime stage as production. For live edit-compile-reload loops, run
  # `cargo watch -x 'run -p ddb-server'` OUTSIDE the container with your local
  # toolchain and point it at the dockerised Postgres on localhost:5432.
  darshjdb:
    build:
      context: .
    environment:
      DDB_JWT_SECRET: "dev-secret-not-for-production"
      RUST_LOG: debug
    read_only: false

  # ── DarshJDB cache server (dev password, no .env required) ───────────
  ddb-cache:
    environment:
      DARSH_CACHE_PASSWORD: "dev-cache-password-change-me"
      RUST_LOG: debug

  # ── PostgreSQL (expose port for local tools) ─────────────────────────
  postgres:
    ports:
      - "5432:5432"

  # ── pgAdmin ─────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@db.darshj.me}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - darshjdb

  # ── Prometheus ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - darshjdb

  # ── Grafana ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - darshjdb

volumes:
  prometheus_data:
  grafana_data:
